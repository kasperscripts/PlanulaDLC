name: Upload full APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install delta decoder
        run: sudo apt-get update && sudo apt-get install -y xdelta3
      - name: Restore verified APK
        run: python3 release/restore_apk.py
      - name: Upload full APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.4.1-icon-crack release/PlanulaDLC-1.4.1-icon_crack.apk --repo "$GITHUB_REPOSITORY"
