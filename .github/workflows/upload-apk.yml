name: Upload full APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            release/assemble_apk.py
            release/full/manifest.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Assemble verified APK
        run: python3 release/assemble_apk.py
      - name: Upload full APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.4.1-icon-crack release/PlanulaDLC-1.4.1-icon_crack.apk --repo "$GITHUB_REPOSITORY"
